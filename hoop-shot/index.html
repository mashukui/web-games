<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, #101b2d 0%, #1d2c45 55%, #2c2038 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    justify-content: safe center;
    min-height: 100vh; min-height: 100svh; padding: 8px 8px 4px;
    user-select: none; touch-action: manipulation; color: #fff;
  }
  .panel {
    position: relative;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 18px; padding: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);

  .topbar { display: flex; align-items: center; gap: 6px; width: 100%; }

  #mute-btn {
    flex: 0 0 auto; width: 44px; height: 44px; border-radius: 10px; padding: 0;
    background: rgba(255,255,255,.07); border: none; color: #fff;
    font-size: 17px; cursor: pointer; font-family: inherit;
  }

  /* 480×720 画布：宽度同时受可用高度反推，必须写两行（svh + vh） */
  .wrap {
    width: min(480px, 100%, max(200px, calc((100svh - 250px) * 0.66667)));
    width: min(480px, 100%, max(200px, calc((100vh  - 250px) * 0.66667)));
    margin: 0 auto; border-radius: 14px; overflow: hidden; line-height: 0;
    background: #0b1424; box-shadow: 0 10px 30px rgba(0,0,0,.45);
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: auto; touch-action: none; }

  .overlay {
    position: absolute; inset: 0; border-radius: 18px; z-index: 6;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 7px; text-align: center; padding: 18px;
    background: rgba(10, 16, 28, .9); backdrop-filter: blur(3px); color: #fff;
  }
  .hidden { display: none !important; }
  .over-title { font-size: 22px; font-weight: 800; letter-spacing: 1.5px; }
  .over-sub { font-size: 13px; opacity: .82; line-height: 1.6; }
  .icon-big { font-size: 40px; }
  .final-line { font-size: 15px; font-weight: 700; }
  .new-record {
    background: #ffd76e; color: #5a3e00; font-size: 12px; font-weight: 800;
    padding: 4px 14px; border-radius: 999px; animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.08) } }
  .over-btns { display: flex; gap: 8px; margin-top: 6px; width: 100%; }
  .over-btns button {
    flex: 1; min-height: 44px; border-radius: 12px; border: none; cursor: pointer;
    font-size: 14px; font-weight: 800; font-family: inherit;
  }
  .btn-primary { background: #4a90ff; color: #fff; box-shadow: 0 4px 0 #2a63bd; }
  .btn-ghost { background: rgba(255,255,255,.14); color: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
  .start-btn { margin-top: 6px; padding: 12px 28px; min-height: 48px; border: none; border-radius: 12px;
    font-size: 15px; font-weight: 800; font-family: inherit; }

  .footer {
    margin-top: 10px; color: rgba(255,255,255,.5); font-size: 12px;
    text-align: center; line-height: 1.9; max-width: 470px;
  }
  .footer a {
    color: rgba(255,255,255,.78); text-decoration: none; display: inline-block;
    min-width: 44px; min-height: 44px; line-height: 44px;
  }
  .footer a:hover { color: #ffd76e; }

  /* 横屏 / 矮窗口：画布在左，数据在右；页脚工具行并进文字行 */
  @media (orientation: landscape) and (max-height: 560px) {
    body { padding: 4px 6px 2px; }
    .panel {
      display: grid; grid-template-columns: auto 152px;
      grid-template-areas: "game side";
      align-items: center; padding: 6px; gap: 8px;
    }
    .wrap {
      grid-area: game;
      width: min(480px, calc((100svh - 84px) * 0.66667));
      width: min(480px, calc((100vh  - 84px) * 0.66667));
    }
    .topbar { grid-area: side; flex-direction: column; gap: 5px; width: 100%; }
    .stat { width: 100%; padding: 2px 4px; }
    .stat small { font-size: 8px; letter-spacing: .4px; }
    .stat span { font-size: 13px; }
    .footer { max-width: none; margin-top: 3px; line-height: 1.4; font-size: 11px; }
    .footer .wg-tools { display: inline-flex; vertical-align: middle; margin: 0 8px 0 0; }
    .footer a { line-height: 44px; }
    .overlay { padding: 10px; gap: 5px; }
    .over-title { font-size: 18px; }
    .over-sub, .final-line { font-size: 12px; }
    .icon-big { font-size: 26px; }
    .over-btns button { min-height: 44px; font-size: 13px; }
  }
</style>

<script>
(function () {
  'use strict';

  var W = 480, H = 720;
  var BALL_X = 240, BALL_Y = 520, BALL_R = 12;
  var RIM_Y = 230;
  var HOOP_W = 86;
  var HOOP_MIN = 90, HOOP_MAX = 390;      // 篮筐中心往返范围，永不出画布
  var GRAV = 1050;
  var MAX_PULL = 150;                     // 反向拖拽满力距离（世界像素）
  var MAX_SPEED = 1000;
  var SPEED_PER_PX = MAX_SPEED / MAX_PULL;
  var FLIGHT_MAX = 1.1;                   // 出手后 1.1s 必重置
  var GAME_TIME = 60;
  var STORE_KEY = 'hoop_shot_best_v1';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var panel = document.getElementById('panel');
  var footerEl = document.querySelector('.footer');
  var startOverlay = document.getElementById('start-overlay');
  var overOverlay = document.getElementById('over-overlay');

  // ===== 音效 =====
  var audioCtx = null, muted = false;
  function beep(freq, dur, type, vol) {
    if (muted) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.12, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }
  var sfx = {
    pull:  function () { beep(210, 0.03, 'sine', 0.03); },
    shoot: function () { beep(680, 0.08, 'triangle', 0.06); },
    score: function (n) { beep(n >= 3 ? 900 : 620, 0.1, 'triangle', 0.08); setTimeout(function () { beep(n >= 3 ? 1180 : 820, 0.12, 'triangle', 0.06); }, 70); },
    miss:  function () { beep(150, 0.12, 'sawtooth', 0.04); },
    over:  function () { [523.25, 440, 349.23].forEach(function (f, i) { setTimeout(function () { beep(f, 0.22, 'triangle', 0.08); }, i * 140); }); }
  };
  var muteBtn = document.getElementById('mute-btn');
  muteBtn.addEventListener('click', function (e) {
    e.stopPropagation(); muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });

  // ===== 状态 =====
  var ball = { x: BALL_X, y: BALL_Y, vx: 0, vy: 0, r: BALL_R };
  var hoop = { x: 240, y: RIM_Y, w: HOOP_W, speed: 22, dir: 1 };
  var score = 0, made = 0, shots = 0, combo = 0, bestCombo = 0;
  var timeLeft = GAME_TIME, elapsed = 0, flightT = 0, scored = false;
  var aim = { active: false, dx: 0, dy: 0, power: 0, angle: 62, kPower: 0.82, sx: 0, sy: 0 };
  var phase = 'ready', started = false, endKey = null, endStats = null;
  var best = 0, newRecord = false;
  var pops = [];
  var acc = 0;
  var keyAim = false;      // 键盘调过瞄准后才显示预判虚线/力度条
  var DPR = 1;

  try { best = parseInt(localStorage.getItem(STORE_KEY) || '0', 10) || 0; } catch (e) { best = 0; }
  function saveBest() { try { localStorage.setItem(STORE_KEY, String(best)); } catch (e) {} }

  // ===== 物理：真实球与虚线预判共用这一个积分步 =====
  function integrate(b, h) {
    b.vy += GRAV * h;
    b.x += b.vx * h;
    b.y += b.vy * h;
  }
  function velocityFromAim() {
    if (aim.active) {
      return { vx: aim.dx * SPEED_PER_PX, vy: aim.dy * SPEED_PER_PX };
    }
    var sp = MAX_SPEED * aim.kPower;
    var ang = Math.max(8, Math.min(87, aim.angle));
    var rad = ang * Math.PI / 180;
    return { vx: Math.cos(rad) * sp, vy: -Math.sin(rad) * sp };
  }
  function powerFromAim() {
    if (aim.active) return Math.min(1, Math.hypot(aim.dx, aim.dy) / MAX_PULL);
    return aim.kPower;
  }

  // ===== 回合 =====
  function launch(vel) {
    if (!started || phase === 'over' || phase === 'fly') return false;
    var v = vel || velocityFromAim();
    if (Math.hypot(v.vx, v.vy) < 60) return false;
    ball.x = BALL_X; ball.y = BALL_Y; ball.vx = v.vx; ball.vy = v.vy;
    flightT = 0; scored = false; shots++;
    phase = 'fly'; aim.active = false;
    sfx.shoot(); refreshHud();
    return true;
  }
  function resetBall() {
    if (!scored) { combo = 0; sfx.miss(); }
    ball.x = BALL_X; ball.y = BALL_Y; ball.vx = 0; ball.vy = 0;
    flightT = 0; scored = false;
    if (phase !== 'over') phase = 'ready';
    aim.power = 0; aim.dx = 0; aim.dy = 0; aim.active = false;
    refreshHud();
  }
  function award(base, dx) {
    scored = true; made++; combo++;
    if (combo > bestCombo) bestCombo = combo;
    var mult = Math.min(3, Math.pow(1.2, combo - 1));
    var pts = Math.round(base * mult);
    score += pts;
    pops.push({ x: hoop.x, y: hoop.y - 40, txt: '+' + pts, life: 1.2 });
    sfx.score(base);
    refreshHud();
  }
  function finish() {
    phase = 'over'; endKey = 'hoopShot.over'; started = true;
    newRecord = false;
    if (score > best) { best = score; newRecord = true; saveBest(); }
    endStats = { score: score, made: made, shots: shots, bestCombo: bestCombo };
    refreshHud(); refreshBest(); refreshOver();
    overOverlay.classList.remove('hidden');
    sfx.over();
  }
  function begin() {
    if (started) return;
    started = true;
    startOverlay.classList.add('hidden');
  }
  function newGame(showStart) {
    score = 0; made = 0; shots = 0; combo = 0; bestCombo = 0;
    timeLeft = GAME_TIME; elapsed = 0; flightT = 0; scored = false;
    ball.x = BALL_X; ball.y = BALL_Y; ball.vx = 0; ball.vy = 0;
    hoop.x = 240; hoop.dir = 1; hoop.speed = 22;
    aim.active = false; aim.dx = 0; aim.dy = 0; aim.power = 0; aim.kPower = 0.82; aim.angle = 62;
    keyAim = false;
    pops = []; acc = 0;
    phase = 'ready'; endKey = null; endStats = null; newRecord = false;
    overOverlay.classList.add('hidden');
    document.getElementById('new-record').classList.add('hidden');
    started = !showStart;
    startOverlay.classList.toggle('hidden', !showStart);
    refreshAll();
  }

  // ===== 固定步进 1/120 =====
  function step() {
    if (phase === 'over') return;
    if (!started) return;
    var h = 1 / 120;
    elapsed += h;
    timeLeft -= h;
    if (timeLeft <= 0) { timeLeft = 0; finish(); return; }

    // 篮筐：22 px/s 起，越玩越快，上限 80
    hoop.speed = Math.min(80, 22 + elapsed * 0.8);
    hoop.x += hoop.dir * hoop.speed * h;
    if (hoop.x < HOOP_MIN) { hoop.x = HOOP_MIN; hoop.dir = 1; }
    if (hoop.x > HOOP_MAX) { hoop.x = HOOP_MAX; hoop.dir = -1; }

    if (phase === 'fly') {
      var py = ball.y;
      integrate(ball, h);
      flightT += h;
      if (!scored && py < RIM_Y && ball.y >= RIM_Y && ball.vy > 0) {
        var dx = Math.abs(ball.x - hoop.x);
        if (dx <= HOOP_W / 2 - BALL_R) award(dx <= 9 ? 3 : 2, dx);
      }
      if (flightT >= FLIGHT_MAX) resetBall();
      return;
    }
    // 未出手时球停在原点；出界/卡死兜底
    if (ball.x !== BALL_X || ball.y !== BALL_Y) resetBall();
  }
  function update(dtFrames) {
    var frames = Math.min(dtFrames, 2.5);
    acc += frames / 60;
    var guard = 0;
    while (acc >= 1 / 120 && guard++ < 8) {
      acc -= 1 / 120;
      step();
    }
    if (acc > 0.1) acc = 0;
    for (var i = pops.length - 1; i >= 0; i--) {
      pops[i].life -= frames / 60;
      pops[i].y -= 26 * frames / 60;
      if (pops[i].life <= 0) pops.splice(i, 1);
    }
  }

  // ===== 渲染 =====
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function drawBg() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#122238'); g.addColorStop(0.55, '#1c3350'); g.addColorStop(1, '#2a1e33');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // 观众席光斑
    ctx.fillStyle = 'rgba(255,255,255,.04)';
    for (var i = 0; i < 40; i++) {
      var x = (i * 97) % W, y = 40 + ((i * 53) % 120);
      ctx.beginPath(); ctx.arc(x, y, 3 + (i % 3), 0, 6.283); ctx.fill();
    }
    // 地板
    ctx.fillStyle = '#6b4a2f'; ctx.fillRect(0, 640, W, H - 640);
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(0, 640, W, 4);
    ctx.strokeStyle = 'rgba(255,255,255,.13)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, 664); ctx.lineTo(W, 664); ctx.stroke();
    ctx.beginPath(); ctx.arc(240, 700, 54, Math.PI, 0); ctx.stroke();
  }
  function drawHoop() {
    var hx = hoop.x, hy = hoop.y;
    // 篮板
    ctx.fillStyle = 'rgba(230,242,255,.16)';
    roundRect(hx - 54, hy - 92, 108, 78, 8); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 3;
    roundRect(hx - 54, hy - 92, 108, 78, 8); ctx.stroke();
    ctx.strokeStyle = '#ff5a4d'; ctx.lineWidth = 3;
    ctx.strokeRect(hx - 20, hy - 52, 40, 30);
    // 网
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
    for (var i = 0; i <= 6; i++) {
      var x1 = hx - 42 + i * 14, x2 = hx - 26 + i * 8.7;
      ctx.beginPath(); ctx.moveTo(x1, hy + 2); ctx.lineTo(x2, hy + 46); ctx.stroke();
    }
    for (var j = 1; j <= 3; j++) {
      var yy = hy + j * 14, shrink = j * 5.3;
      ctx.beginPath(); ctx.moveTo(hx - 42 + shrink, yy); ctx.lineTo(hx + 42 - shrink, yy); ctx.stroke();
    }
    // 篮圈
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#ff7a1a'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(hx - HOOP_W / 2, hy); ctx.lineTo(hx + HOOP_W / 2, hy); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(hx - HOOP_W / 2 + 2, hy - 2); ctx.lineTo(hx + HOOP_W / 2 - 2, hy - 2); ctx.stroke();
    ctx.lineCap = 'butt';
  }
  function drawBall() {
    var r = ball.r;
    var g = ctx.createRadialGradient(ball.x - r * 0.35, ball.y - r * 0.4, r * 0.2, ball.x, ball.y, r);
    g.addColorStop(0, '#ffb066'); g.addColorStop(0.6, '#f07a14'); g.addColorStop(1, '#b8480a');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, r, 0, 6.283); ctx.fill();
    ctx.strokeStyle = 'rgba(70,30,0,.65)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, r, 0, 6.283); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ball.x - r, ball.y); ctx.lineTo(ball.x + r, ball.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ball.x, ball.y - r); ctx.lineTo(ball.x, ball.y + r); ctx.stroke();
    ctx.beginPath(); ctx.arc(ball.x - r * 1.25, ball.y, r * 1.4, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(ball.x + r * 1.25, ball.y, r * 1.4, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke();
  }
  function drawGuide() {
    if (phase !== 'ready' || !started) return;
    if (!aim.active && !keyAim) return;
    var pw = powerFromAim();
    if (pw < 0.03) return;
    var v = velocityFromAim();
    var b = { x: BALL_X, y: BALL_Y, vx: v.vx, vy: v.vy };
    ctx.save();
    ctx.setLineDash([5, 7]);
    ctx.strokeStyle = 'rgba(140,220,255,.75)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(b.x, b.y);
    var i;
    for (i = 0; i < 140; i++) {
      integrate(b, 1 / 120);
      if (i % 4 === 0) ctx.lineTo(b.x, b.y);
      if (b.y >= RIM_Y && b.vy > 0) break;
      if (b.y > H) break;
    }
    ctx.stroke();
    ctx.restore();
    // 力度条
    var bx = 24, by = 664, bw = 150, bh = 12;
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    roundRect(bx, by, bw, bh, 6); ctx.fill();
    ctx.fillStyle = pw > 0.9 ? '#ff7a4d' : '#66e0a0';
    roundRect(bx + 2, by + 2, Math.max(0, (bw - 4) * pw), bh - 4, 4); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1;
    roundRect(bx, by, bw, bh, 6); ctx.stroke();
  }
  function drawAimStick() {
    if (!aim.active) return;
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(BALL_X, BALL_Y); ctx.lineTo(BALL_X - aim.dx, BALL_Y - aim.dy); ctx.stroke();
    ctx.setLineDash([]);
  }
  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    drawBg();
    drawHoop();
    drawGuide();
    drawAimStick();
    if (!(phase === 'over' && ball.y > 660)) drawBall();
    for (var i = 0; i < pops.length; i++) {
      ctx.globalAlpha = Math.max(0, Math.min(1, pops[i].life));
      ctx.fillStyle = '#ffd76e'; ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(pops[i].txt, pops[i].x, pops[i].y);
    }
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
    if (combo > 1) {
      ctx.fillStyle = 'rgba(255,215,110,.9)'; ctx.font = 'bold 18px sans-serif';
      ctx.fillText('x' + Math.min(3, Math.pow(1.2, combo - 1)).toFixed(1), 24, 630);
    }
  }
  var last = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    var dt = Math.min((now - last) / 16.666, 2.5);
    last = now;
    update(dt);
    draw();
  }
  document.addEventListener('visibilitychange', function () { last = performance.now(); acc = 0; });

  // ===== 尺寸 / DPR =====
  function fit() {
    DPR = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
    var cw = Math.round(W * DPR), chh = Math.round(H * DPR);
    if (canvas.width !== cw || canvas.height !== chh) {
      canvas.width = cw; canvas.height = chh;
    }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  var resizeTimer = null;
  window.addEventListener('resize', function () {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fit, 80);
  });
  window.addEventListener('orientationchange', function () { setTimeout(fit, 200); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  window.addEventListener('load', function () { setTimeout(fit, 300); });

  // ===== HUD =====
  function refreshHud() {
    document.getElementById('hud-score').textContent = String(score);
    document.getElementById('hud-time').textContent = String(Math.ceil(timeLeft));
    document.getElementById('hud-made').textContent = made + '/' + shots;
    document.getElementById('hud-best').textContent = String(best);
    document.getElementById('stat-time').classList.toggle('hot', timeLeft <= 10 && phase !== 'over');
  }
  function refreshBest() {
    document.getElementById('start-best').textContent =
      best > 0 ? t('common.bestScore', { n: best }) : t('hoopShot.first');
    document.getElementById('over-best').textContent =
      best > 0 ? t('common.bestScore', { n: best }) : '';
  }
  function refreshOver() {
    if (!endKey) {
      document.getElementById('over-title').textContent = '';
      document.getElementById('final-line').textContent = '';
      return;
    }
    document.getElementById('over-title').textContent = t(endKey);
    document.getElementById('final-line').textContent = t('hoopShot.final', {
      s: endStats.score, m: endStats.made, n: endStats.shots, c: endStats.bestCombo
    });
    document.getElementById('new-record').classList.toggle('hidden', !newRecord);
  }
  function refreshAll() { refreshHud(); refreshBest(); refreshOver(); fit(); }
  WG.onChange(refreshAll);

  // ===== 输入：指针 =====
  function toWorld(e) {
    var r = canvas.getBoundingClientRect();
    if (!(r.width > 0) || !(r.height > 0)) return { x: 0, y: 0 };
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  function setAim(wx, wy) {
    aim.dx = aim.sx - wx;
    aim.dy = aim.sy - wy;
    var len = Math.hypot(aim.dx, aim.dy);
    aim.power = Math.min(1, len / MAX_PULL);
    if (len > 4) aim.angle = Math.atan2(aim.dy, aim.dx) * 180 / Math.PI;
  }
  canvas.addEventListener('pointerdown', function (e) {
    if (phase === 'over') return;
    e.preventDefault();
    begin();
    if (phase !== 'ready') return;
    var w = toWorld(e);
    var nearBall = Math.hypot(w.x - BALL_X, w.y - BALL_Y) <= 160;
    var lower = w.y > H * 0.667;
    if (!nearBall && !lower) return;
    aim.active = true; aim.power = 0; aim.dx = 0; aim.dy = 0;
    aim.sx = nearBall ? BALL_X : w.x;
    aim.sy = nearBall ? BALL_Y : w.y;
    sfx.pull();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!aim.active) return;
    e.preventDefault();
    var w = toWorld(e);
    setAim(w.x, w.y);
  });
  function endAim(e) {
    if (!aim.active) return;
    if (powerFromAim() < 0.06) { aim.active = false; aim.power = 0; return; }
    /* 先按拖拽向量算出初速，再关掉 aim，否则会退回键盘分支把球往脚下打 */
    var v = velocityFromAim();
    aim.active = false;
    launch(v);
  }
  canvas.addEventListener('pointerup', endAim);
  canvas.addEventListener('pointercancel', function () { aim.active = false; aim.power = 0; });
  canvas.addEventListener('click', function () {
    begin();
  });

  // ===== 输入：键盘 =====
  window.addEventListener('keydown', function (e) {
    var k = String(e.key || '').toLowerCase();
    if (k === 'arrowleft' || k === 'a') { keyAim = true; aim.angle = Math.min(87, aim.angle + 2); e.preventDefault(); return; }
    if (k === 'arrowright' || k === 'd') { keyAim = true; aim.angle = Math.max(8, aim.angle - 2); e.preventDefault(); return; }
    if (k === 'arrowup' || k === 'w') { keyAim = true; aim.kPower = Math.min(1, aim.kPower + 0.04); e.preventDefault(); return; }
    if (k === 'arrowdown' || k === 's') { keyAim = true; aim.kPower = Math.max(0.05, aim.kPower - 0.04); e.preventDefault(); return; }
    if (k === ' ' || k === 'enter' || k === 'spacebar') {
      begin();
      launch();
      e.preventDefault(); return;
    }
  });

  // ===== 按钮 / 分享 =====
  document.getElementById('btn-start').addEventListener('click', begin);
  document.getElementById('btn-again').addEventListener('click', function () { newGame(false); });
  document.getElementById('btn-share').addEventListener('click', function () {
    var btn = document.getElementById('btn-share');
    var txt = t('hoopShot.share', {
      s: endStats ? endStats.score : score,
      m: endStats ? endStats.made : made,
      n: endStats ? endStats.shots : shots,
      url: location.href
    });
    function done() {
      btn.textContent = t('common.copied');
      setTimeout(function () { btn.textContent = t('common.shareScore'); }, 1500);
    }
    function fb() {
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (err) {}
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fb);
    else fb();
  });

  // ===== 探针钩子 =====
  window.__st = function () {
    return {
      score: score, made: made, shots: shots, timeLeft: timeLeft, phase: phase,
      ball: { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy, r: ball.r },
      hoopX: hoop.x, aimPower: powerFromAim(), combo: combo, endKey: endKey
    };
  };
  window.__drive = function (n) { for (var i = 0; i < n; i++) update(1); };
  window.__reset = function () { newGame(false); started = true; startOverlay.classList.add('hidden'); return window.__st(); };
  /* 返回一次能命中篮筐的真实拖拽（client 坐标）：从球心拖到 (x1,y1) 再松手 */
  window.__aimFor = function () {
    var T = 0.95;
    var hx = hoop.x + hoop.dir * hoop.speed * T;
    if (hx < HOOP_MIN) hx = HOOP_MIN + (HOOP_MIN - hx);
    if (hx > HOOP_MAX) hx = HOOP_MAX - (hx - HOOP_MAX);
    var vx = (hx - BALL_X) / T;
    var vy = (RIM_Y - BALL_Y) / T - 0.5 * GRAV * T;
    var r = canvas.getBoundingClientRect();
    function cx(x) { return r.left + x / W * r.width; }
    function cy(y) { return r.top + y / H * r.height; }
    return {
      x0: cx(BALL_X), y0: cy(BALL_Y),
      x1: cx(BALL_X - vx / SPEED_PER_PX), y1: cy(BALL_Y - vy / SPEED_PER_PX)
    };
  };

  // ===== 启动 =====
  newGame(true);
  fit();
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
